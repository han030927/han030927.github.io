<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="675" viewBox="0 0 1200 675" role="img" aria-labelledby="title desc">
  <title id="title">BIP paper cover</title>
  <desc id="desc">Typographic cover for BIP, a paper on information transfer and completion prompting for visual recognition with missing modalities, published at ECCV 2026.</desc>
  <rect width="1200" height="675" fill="#f0f4f8"/>
  <rect x="0" y="0" width="18" height="675" fill="#2563eb"/>
  <circle cx="1050" cy="80" r="250" fill="#e1eaf6"/>
  <circle cx="1125" cy="70" r="165" fill="#d4e1f2"/>
  <text x="90" y="105" font-family="Arial, Helvetica, sans-serif" font-size="24" font-weight="700" letter-spacing="4" fill="#45607d">MULTIMODAL LEARNING</text>
  <text x="80" y="320" font-family="Arial, Helvetica, sans-serif" font-size="180" font-weight="700" letter-spacing="-7" fill="#172b46">BIP<tspan fill="#2563eb">.</tspan></text>
  <text x="90" y="407" font-family="Arial, Helvetica, sans-serif" font-size="36" font-weight="500" fill="#314962">Bi-Level Information Transfer</text>
  <text x="90" y="458" font-family="Arial, Helvetica, sans-serif" font-size="36" font-weight="500" fill="#314962">and Completion Prompting</text>
  <text x="90" y="512" font-family="Arial, Helvetica, sans-serif" font-size="27" fill="#526b84">Visual recognition with missing modalities</text>
  <path d="M90 563H1110" stroke="#c5d3e2" stroke-width="2"/>
  <text x="90" y="612" font-family="Arial, Helvetica, sans-serif" font-size="25" font-weight="700" fill="#2563eb">ECCV 2026</text>
</svg>

